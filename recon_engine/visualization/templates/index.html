<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECON // OPERATIONAL</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/layout.css">
</head>
<body>
    <!-- Boot Sequence -->
    <div id="boot-sequence">
        <div class="boot-inner">
            <div class="boot-lines" id="boot-lines"></div>
            <div class="boot-status">
                <span id="boot-status-text">INITIALIZING</span>
                <span class="boot-cursor">_</span>
            </div>
        </div>
    </div>

    <!-- Noise / Grain Overlay -->
    <div id="noise-overlay"></div>
    <div id="scanline-overlay"></div>

    <!-- Main Interface -->
    <div id="interface" class="hidden">

        <!-- Status Bar -->
        <header id="status-bar">
            <div class="sb-left">
                <div class="sb-block sb-ident">
                    <span class="sb-label">OP</span>
                    <span class="sb-value" id="sb-target">—</span>
                </div>
                <div class="sb-block sb-threat">
                    <span class="sb-label">THREAT</span>
                    <div class="threat-indicator">
                        <div class="threat-fill" id="threat-fill"></div>
                    </div>
                    <span class="sb-value sb-threat-val" id="threat-score">0</span>
                </div>
            </div>
            <div class="sb-center">
                <span class="sb-mode" id="sb-mode">RECON</span>
            </div>
            <div class="sb-right">
                <div class="sb-block">
                    <span class="sb-label">CRIT</span>
                    <span class="sb-value sb-crit" id="sb-crit">0</span>
                </div>
                <div class="sb-block">
                    <span class="sb-label">HIGH</span>
                    <span class="sb-value sb-high" id="sb-high">0</span>
                </div>
                <div class="sb-block">
                    <span class="sb-label">CHAINS</span>
                    <span class="sb-value sb-chain-count" id="sb-chains">0</span>
                </div>
                <div class="sb-block sb-time">
                    <span class="sb-label">ELAPSED</span>
                    <span class="sb-value" id="sb-time">00:00</span>
                </div>
                <!-- Operation Mode Toggle -->
                <button class="sb-mode-toggle" id="mode-toggle" title="Toggle Operation Mode">
                    <span class="mode-toggle-label" id="mode-toggle-label">OP</span>
                </button>
            </div>
        </header>

        <!-- Recommended Action Bar -->
        <div id="recommended-bar" class="recommended-bar hidden">
            <span class="rec-prefix">[RECOMMENDED]</span>
            <span class="rec-action" id="rec-action"></span>
            <span class="rec-arrow">→</span>
            <span class="rec-outcome" id="rec-outcome"></span>
            <span class="rec-confidence" id="rec-confidence"></span>
            <button class="rec-simulate" id="rec-simulate" title="Simulate this chain">SIMULATE</button>
            <button class="rec-focus" id="rec-focus" title="Focus on this chain">FOCUS</button>
        </div>

        <!-- Operational Area -->
        <div id="op-area">

            <!-- Left: Intel Feed -->
            <aside id="intel-panel">
                <div class="panel-head">
                    <span class="panel-title">INTEL FEED</span>
                    <span class="panel-indicator" id="intel-live"></span>
                </div>
                <div id="intel-feed" class="intel-feed"></div>
            </aside>

            <!-- Center: Threat Map -->
            <main id="map-area">
                <canvas id="threat-map"></canvas>
                <div id="node-tooltip" class="tt hidden"></div>

                <!-- Focus Mode Overlay -->
                <div id="focus-overlay" class="hidden">
                    <div class="focus-header">
                        <span class="focus-label">FOCUS //</span>
                        <span id="focus-title" class="focus-title"></span>
                        <button id="focus-exit" class="focus-exit">[ESC] EXIT</button>
                    </div>
                    <div id="focus-chain" class="focus-chain"></div>
                </div>

                <!-- Simulation Overlay -->
                <div id="sim-overlay" class="hidden">
                    <div class="sim-header">
                        <span class="sim-label">SIMULATION //</span>
                        <span id="sim-step-label" class="sim-step-label"></span>
                        <button id="sim-stop" class="focus-exit">[ESC] STOP</button>
                    </div>
                    <div id="sim-progress" class="sim-progress"></div>
                </div>

                <!-- Map Controls -->
                <div id="map-hud">
                    <button class="hud-btn" id="btn-zoom-in" title="Zoom in">+</button>
                    <button class="hud-btn" id="btn-zoom-out" title="Zoom out">&minus;</button>
                    <button class="hud-btn" id="btn-reset" title="Reset view">R</button>
                    <button class="hud-btn" id="btn-labels" title="Toggle labels">L</button>
                </div>
            </main>

            <!-- Right: Operations Panel -->
            <aside id="ops-panel">
                <div class="panel-head">
                    <span class="panel-title">OPERATIONS</span>
                </div>

                <!-- Tabs -->
                <div class="ops-tabs">
                    <button class="ops-tab active" data-tab="chains">CHAINS</button>
                    <button class="ops-tab" data-tab="findings">FINDINGS</button>
                    <button class="ops-tab" data-tab="actions">ACTIONS</button>
                </div>

                <!-- Chains Tab (now primary) -->
                <div class="ops-content active" id="tab-chains">
                    <div id="chains-list"></div>
                </div>

                <!-- Findings Tab -->
                <div class="ops-content" id="tab-findings">
                    <div class="severity-filter">
                        <button class="sev-btn active" data-sev="all">ALL</button>
                        <button class="sev-btn" data-sev="critical">C</button>
                        <button class="sev-btn" data-sev="high">H</button>
                        <button class="sev-btn" data-sev="medium">M</button>
                        <button class="sev-btn" data-sev="low">L</button>
                    </div>
                    <div id="findings-list" class="findings-list"></div>
                </div>

                <!-- Actions Tab -->
                <div class="ops-content" id="tab-actions">
                    <div id="actions-list"></div>
                </div>
            </aside>
        </div>

        <!-- Detail Drawer -->
        <div id="detail-drawer" class="drawer hidden">
            <div class="drawer-inner">
                <div class="drawer-head">
                    <span id="drawer-sev" class="drawer-sev"></span>
                    <span id="drawer-id" class="drawer-id"></span>
                    <button id="drawer-close" class="drawer-close">&times;</button>
                </div>
                <h2 id="drawer-title" class="drawer-title"></h2>
                <div id="drawer-body" class="drawer-body"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/threatmap.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
